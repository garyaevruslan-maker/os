<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruslan OS</title>

<style>
body{
  background:#080b10;
  color:#fff;
  font-family:Arial;
  padding:20px;
}
textarea{
  width:100%;
  height:120px;
  background:#111;
  color:#fff;
  border:1px solid #333;
  padding:10px;
}
button{
  margin-top:10px;
  padding:10px 20px;
  background:#e2c477;
  border:0;
  cursor:pointer;
}
.item{
  border-top:1px solid #333;
  padding:10px 0;
}
</style>
</head>

<body>

<h1>Дневник</h1>

<textarea id="journalInput" placeholder="пиши сюда..."></textarea>
<br>
<button onclick="saveJournal()">Записать</button>

<div id="journalList"></div>

<script>
const $ = s => document.querySelector(s);
const KEY = 'ruslan_os_v2';

function load(){
  return JSON.parse(localStorage.getItem(KEY)) || {journal:[], ai:{key:''}};
}
function save(s){
  localStorage.setItem(KEY, JSON.stringify(s));
}

let S = load();

function render(){
  $('#journalList').innerHTML = S.journal.map(x => `
    <div class="item">
      ${new Date(x.date).toLocaleString()}<br>
      ${x.text}
    </div>
  `).join('');
}

async function saveJournal(){
  const v = $('#journalInput').value.trim();
  if(!v) return alert('Пусто');

  // запись пользователя
  S.journal.unshift({
    text: v,
    date: new Date().toISOString()
  });

  $('#journalInput').value = '';
  save(S);
  render();

  try{
    const res = await fetch('https://openai-proxy.vercel.app/api/chat', {
      method:'POST',
      headers:{
        'Content-Type':'application/json'
      },
      body: JSON.stringify({
        message: v,
        apiKey: S.ai.key,
        model: 'gpt-4o-mini'
      })
    });

    const data = await res.json();

    if(data.reply){
      S.journal.unshift({
        text: data.reply,
        date: new Date().toISOString()
      });

      save(S);
      render();
    } else {
      alert('Ошибка ответа AI');
    }

  } catch(e){
    alert('Ошибка соединения');
  }
}

// ВСТАВЬ СЮДА СВОЙ КЛЮЧ
S.ai.key = "sk-eldvQQkFXv9N1m791KvGvNlu4ZJXxlNxhUo36RLeYqkAYTPSeaDp6u1hOPKV";

render();
</script>

</body>
</html>
