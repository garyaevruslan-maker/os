<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ruslan OS</title>
<style>
body{background:#0b0f16;color:#fff;font-family:sans-serif;padding:20px}
textarea{width:100%;height:120px;margin-bottom:10px}
button{padding:10px 20px;background:#e2c477;border:0}
.item{margin-top:20px;padding:10px;border:1px solid #333}
</style>
</head>

<body>

<h2>Дневник</h2>

<textarea id="journalInput" placeholder="пиши сюда..."></textarea>
<button onclick="saveJournal()">Записать</button>

<div id="journalList"></div>

<script>
const KEY = "ruslan_simple_ai";
let S = JSON.parse(localStorage.getItem(KEY)) || {
  journal: [],
  ai: {
    url: "https://api.genapi.ai/v1/chat/completions",
    key: "",
    model: "gpt-4o-mini"
  }
};

function saveState(){
  localStorage.setItem(KEY, JSON.stringify(S));
}

// 👉 ВСТАВЬ СЮДА СВОЙ КЛЮЧ
S.ai.key = "sk-eldvQQkFXv9N1m791KvGvNlu4ZJXxlNxhUo36RLeYqkAYTPSeaDp6u1hOPKV";

async function askAI(text){
  if(!S.ai.key) return "Нет API ключа";

  try{
    const res = await fetch(S.ai.url, {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer " + S.ai.key
      },
      body: JSON.stringify({
        model: S.ai.model,
        messages:[
          {role:"system",content:"Ты спокойный, жесткий проводник. Коротко: срез, ошибка, действие."},
          {role:"user",content:text}
        ]
      })
    });

    const data = await res.json();
    return data.choices?.[0]?.message?.content || "Ошибка";
  }catch(e){
    return "Ошибка соединения";
  }
}

async function saveJournal(){
  const text = document.getElementById("journalInput").value.trim();
  if(!text) return;

  const entry = {
    text,
    date: new Date().toISOString(),
    ai: "..."
  };

  document.getElementById("journalInput").value = "";

  render();

  entry.ai = await askAI(text);

  S.journal.unshift(entry);
  saveState();
  render();
}

function render(){
  const list = document.getElementById("journalList");

  list.innerHTML = S.journal.map(x => `
    <div class="item">
      <b>${new Date(x.date).toLocaleString()}</b><br>
      ${x.text}<br><br>
      <span style="color:#e2c477">${x.ai || ""}</span>
    </div>
  `).join("");
}

render();
</script>

</body>
</html>
