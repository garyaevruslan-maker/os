<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruslan OS</title>

<style>
body{background:#080b10;color:#fff;font-family:Arial;padding:15px}
textarea{width:100%;height:100px;background:#111;color:#fff;border:1px solid #333;padding:10px}
button{margin-top:10px;padding:10px 20px;background:#e2c477;border:0}
.screen{display:none}
.screen.active{display:block}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#111;padding:10px}
.item{border-top:1px solid #333;padding:10px 0}
.big{font-size:40px}
</style>
</head>

<body>

<!-- ДЕНЬ -->
<div id="day" class="screen active">
  <h2>День</h2>
  <input id="mainInput" placeholder="главное действие">
  <button onclick="saveMain()">Сохранить</button>
  <div id="saved"></div>
</div>

<!-- ВОЗДЕРЖАНИЕ -->
<div id="abstinence" class="screen">
  <h2>Воздержание</h2>
  <div class="big" id="abst">0</div>
  <button onclick="resetAbst()">Сброс</button>
</div>

<!-- ДЕНЬГИ -->
<div id="money" class="screen">
  <h2>Деньги</h2>
  <textarea id="moneyInput"></textarea>
  <button onclick="saveMoney()">Сохранить</button>
  <div id="moneyList"></div>
</div>

<!-- ДНЕВНИК -->
<div id="journal" class="screen">
  <h2>Дневник</h2>
  <textarea id="journalInput"></textarea>
  <button onclick="saveJournal()">Записать</button>
  <div id="journalList"></div>
</div>

<!-- ОТЧЕТ -->
<div id="report" class="screen">
  <h2>Отчет</h2>
  <div id="reportBox"></div>
</div>

<!-- ПРОФИЛЬ -->
<div id="profile" class="screen">
  <h2>Профиль</h2>
  <input id="apiKey" placeholder="API ключ">
  <button onclick="saveAI()">Сохранить</button>
</div>

<!-- НАВИГАЦИЯ -->
<div class="nav">
<button onclick="go('day')">День</button>
<button onclick="go('abstinence')">Возд</button>
<button onclick="go('money')">Деньги</button>
<button onclick="go('journal')">Дневник</button>
<button onclick="go('profile')">Профиль</button>
</div>

<script>
const $=s=>document.querySelector(s);
const KEY='ruslan_full';

function load(){return JSON.parse(localStorage.getItem(KEY))||{main:'',abstStart:null,money:[],journal:[],ai:{key:''}}}
function save(s){localStorage.setItem(KEY,JSON.stringify(s))}
let S=load();

function go(id){
 document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
 $('#'+id).classList.add('active');
}

function render(){
 $('#saved').textContent=S.main||'';
 $('#abst').textContent=S.abstStart?Math.floor((Date.now()-new Date(S.abstStart))/86400000):0;

 $('#moneyList').innerHTML=S.money.map(x=>`<div class="item">${x.text}</div>`).join('');
 $('#journalList').innerHTML=S.journal.map(x=>`<div class="item">${x.text}</div>`).join('');

 $('#reportBox').innerHTML=`Денег: ${S.money.length}<br>Записей: ${S.journal.length}`;
 $('#apiKey').value=S.ai.key||'';
}

function saveMain(){
 S.main=$('#mainInput').value;
 save(S); render();
}

function resetAbst(){
 S.abstStart=new Date().toISOString();
 save(S); render();
}

function saveMoney(){
 const v=$('#moneyInput').value;
 if(!v)return;
 S.money.unshift({text:v});
 $('#moneyInput').value='';
 save(S); render();
}

async function saveJournal(){
 const v=$('#journalInput').value.trim();
 if(!v)return;

 S.journal.unshift({text:v});
 $('#journalInput').value='';
 save(S); render();

 try{
  const res=await fetch('https://api.gen-api.ru/v1/chat/completions',{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'Authorization':'Bearer '+S.ai.key
    },
    body:JSON.stringify({
      model:'gpt-4o-mini',
      messages:[{role:'user',content:v}]
    })
  });

  const data=await res.json();

  if(data.choices){
    S.journal.unshift({text:data.choices[0].message.content});
    save(S); render();
  }else{
    alert('Ошибка AI');
  }

 }catch(e){
  alert('Ошибка соединения');
 }
}

function saveAI(){
 S.ai.key=$('#apiKey').value.trim();
 save(S);
 alert('сохранено');
}

render();
</script>

</body>
</html>
